<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida de Archivo</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        /* Oculta el input de archivo por defecto */
        .custom-file-input {
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        /* Estilo del área donde el usuario hace clic */
        .file-label {
            cursor: pointer;
            display: block;
            padding: 2.5rem 1rem;
            border: 2px dashed #a0aec0; /* Borde suave */
            border-radius: 0.5rem;
            text-align: center;
            color: #4b5563;
            transition: all 0.2s;
            background-color: #f8fafc;
        }
        /* Efecto al pasar el mouse (simula un estado activo) */
        .file-label:hover {
            border-color: #1a73e8; /* Azul de Google */
            color: #1a73e8;
            background-color: #eef5ff;
        }
        .google-button {
            background-color: #1a73e8;
            transition: background-color 0.3s;
        }
        .google-button:hover {
            background-color: #176bd9;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Paso 2: Subir Archivo</h1>
        <p class="text-center text-gray-500 mb-8">Sube el archivo que se almacenará en tu **Bucket 'files'** de Supabase.</p>
        
        <form action="/process_upload" method="post" enctype="multipart/form-data" class="space-y-6">
            <!-- ID de sesión para mantener el rastro -->
            <input type="hidden" name="session_id" value="{{ session_id }}">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Seleccionar Archivo</label>
                <!-- Área de clic visual -->
                <label for="file-upload" id="file-label" class="file-label">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.884-7.859A5.002 5.002 0 0110 5a5.002 5.002 0 014.884 4.141A4 4 0 0117 16H7zM16 16l-4-4m0 0l-4 4m4-4v12"></path></svg>
                    <span id="file-name" class="font-semibold block mt-3">Arrastra o haz clic para seleccionar</span>
                    <span class="block text-xs mt-1 text-gray-500">Cualquier formato de archivo (Max 5MB)</span>
                </label>
                <!-- El input real (oculto) -->
                <input type="file" id="file-upload" name="file" required class="custom-file-input" onchange="updateFileName(this)">
            </div>
            
            <button type="submit"
                    class="w-full google-button text-white p-3 rounded-lg font-semibold shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300 transform hover:scale-[1.01] transition duration-200">
                Subir Archivo y Finalizar
            </button>
        </form>

        <p class="mt-6 text-xs text-center text-gray-400">ID de Sesión: <code>{{ session_id }}</code></p>
    </div>
    
    <script>
        // Función para actualizar el nombre del archivo seleccionado
        function updateFileName(input) {
            const fileNameSpan = document.getElementById('file-name');
            const fileLabel = document.getElementById('file-label');
            if (input.files && input.files.length > 0) {
                // Muestra el nombre del archivo seleccionado
                fileNameSpan.textContent = `Archivo seleccionado: ${input.files[0].name}`;
                // Resalta la caja en verde
                fileLabel.classList.add('border-green-500');
                fileLabel.classList.remove('border-gray-300');
            } else {
                // Vuelve al texto por defecto si el usuario cancela la selección
                fileNameSpan.textContent = 'Arrastra o haz clic para seleccionar';
                fileLabel.classList.remove('border-green-500');
                fileLabel.classList.add('border-gray-300');
            }
        }
    </script>
</body>
</html>
