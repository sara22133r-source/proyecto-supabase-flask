<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="max-w-lg w-full bg-white p-8 rounded-xl shadow-2xl border-t-4 border-red-500">
        <h1 class="text-4xl font-extrabold text-red-600 mb-4">
            ¡Error!
        </h1>
        <p class="text-xl text-gray-700 mb-4">
            Ha ocurrido un problema interno en la aplicación.
        </p>
        {% if error_message %}
        <div class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-lg text-sm mt-4">
            <p class="font-semibold">Detalle Técnico:</p>
            <p class="whitespace-pre-wrap">{{ error_message }}</p>
        </div>
        {% endif %}
        <div class="mt-6">
            <a href="{{ url_for('index') }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                Volver al Inicio
            </a>
        </div>
    </div>
</body>
</html>
